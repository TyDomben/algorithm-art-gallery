<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Visualization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-900 text-white transition-colors duration-300">
    <!-- Navigation -->
    <nav class="border-b border-gray-800 bg-gray-900/95 backdrop-blur-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <a href="index.html" class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent hover:opacity-80 transition-opacity">
                    ← Algorithm Art Gallery
                </a>
                <div class="flex gap-2">
                    <button id="themeToggle" class="px-3 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors text-sm">
                        🌙 Dark
                    </button>
                    <button id="shareBtn" class="px-3 py-2 rounded-lg bg-purple-600 hover:bg-purple-700 transition-colors text-sm">
                        📤 Share
                    </button>
                    <button id="screenshotBtn" class="px-3 py-2 rounded-lg bg-pink-600 hover:bg-pink-700 transition-colors text-sm">
                        📸 Export
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex flex-col lg:flex-row h-screen">
        <!-- Canvas Area -->
        <div class="flex-1 flex flex-col bg-gray-950 relative">
            <div id="canvasContainer" class="flex-1 flex items-center justify-center relative">
                <canvas id="visualizationCanvas" class="max-w-full max-h-full"></canvas>
                <div id="loadingSpinner" class="absolute inset-0 flex items-center justify-center bg-gray-950/90">
                    <div class="text-center">
                        <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-purple-500 mx-auto mb-4"></div>
                        <p class="text-gray-400">Loading visualization...</p>
                    </div>
                </div>
            </div>

            <!-- Stats Overlay -->
            <div class="absolute top-4 left-4 bg-gray-900/80 backdrop-blur-sm rounded-lg px-4 py-3 text-sm">
                <div class="font-mono space-y-1">
                    <div>Steps: <span id="stepCount" class="text-purple-400">0</span></div>
                    <div>Operations: <span id="operationCount" class="text-pink-400">0</span></div>
                    <div>Time: <span id="timeElapsed" class="text-blue-400">0.0s</span></div>
                </div>
            </div>
        </div>

        <!-- Control Panel -->
        <aside class="lg:w-96 bg-gray-900 border-l border-gray-800 overflow-y-auto">
            <div class="p-6 space-y-6">
                <!-- Algorithm Info -->
                <div>
                    <h1 id="algorithmName" class="text-3xl font-bold mb-2 bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent"></h1>
                    <div class="flex items-center gap-2 mb-4">
                        <span id="difficultyBadge" class="px-2 py-1 rounded text-xs font-semibold"></span>
                        <span id="categoryBadge" class="px-2 py-1 rounded text-xs bg-gray-800"></span>
                    </div>
                    <p id="algorithmDescription" class="text-gray-400 text-sm leading-relaxed"></p>
                </div>

                <!-- Complexity -->
                <div class="bg-gray-800 rounded-lg p-4">
                    <h3 class="font-semibold mb-2">Complexity</h3>
                    <div class="space-y-1 text-sm font-mono">
                        <div>Time: <span id="timeComplexity" class="text-purple-400"></span></div>
                        <div>Space: <span id="spaceComplexity" class="text-pink-400"></span></div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="space-y-4">
                    <h3 class="font-semibold">Controls</h3>

                    <!-- Play/Pause/Reset -->
                    <div class="flex gap-2">
                        <button id="playPauseBtn" class="flex-1 px-4 py-3 rounded-lg bg-purple-600 hover:bg-purple-700 transition-colors font-semibold">
                            ▶ Play
                        </button>
                        <button id="stepBtn" class="px-4 py-3 rounded-lg bg-gray-700 hover:bg-gray-600 transition-colors">
                            ⏭ Step
                        </button>
                        <button id="resetBtn" class="px-4 py-3 rounded-lg bg-gray-700 hover:bg-gray-600 transition-colors">
                            🔄
                        </button>
                    </div>

                    <!-- Speed Control -->
                    <div>
                        <label class="block text-sm mb-2">
                            Speed: <span id="speedValue" class="text-purple-400">1x</span>
                        </label>
                        <input type="range" id="speedSlider" min="0.25" max="4" step="0.25" value="1" class="w-full">
                        <div class="flex justify-between text-xs text-gray-500 mt-1">
                            <span>0.25x</span>
                            <span>4x</span>
                        </div>
                    </div>

                    <!-- Size Control -->
                    <div id="sizeControl">
                        <label class="block text-sm mb-2">
                            Array Size: <span id="sizeValue" class="text-purple-400">50</span>
                        </label>
                        <input type="range" id="sizeSlider" min="10" max="200" step="10" value="50" class="w-full">
                    </div>

                    <!-- Theme Selector -->
                    <div>
                        <label class="block text-sm mb-2">Visual Theme</label>
                        <select id="visualThemeSelector" class="w-full px-3 py-2 rounded-lg bg-gray-800 border border-gray-700">
                            <option value="neon">Neon Dreams</option>
                            <option value="organic">Organic Growth</option>
                            <option value="minimalist">Minimalist</option>
                            <option value="retro">Retro Terminal</option>
                            <option value="synthwave">Synthwave</option>
                            <option value="monochrome">Monochrome</option>
                            <option value="pastel">Pastel Paradise</option>
                        </select>
                    </div>

                    <!-- Random Data -->
                    <button id="randomizeBtn" class="w-full px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 transition-colors">
                        🎲 Randomize Data
                    </button>
                </div>

                <!-- Code Snippet -->
                <div>
                    <button id="codeToggle" class="flex items-center justify-between w-full text-left font-semibold mb-2">
                        <span>Code Implementation</span>
                        <span class="text-gray-500">▼</span>
                    </button>
                    <div id="codeSnippet" class="hidden">
                        <pre class="bg-gray-950 rounded-lg p-4 text-xs overflow-x-auto"><code id="codeContent" class="language-javascript"></code></pre>
                    </div>
                </div>

                <!-- Learn More -->
                <div class="space-y-2">
                    <h3 class="font-semibold">Learn More</h3>
                    <div class="flex flex-col gap-2">
                        <a id="wikiLink" href="#" target="_blank" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors text-center text-sm">
                            📚 Wikipedia
                        </a>
                        <a id="visualgoLink" href="#" target="_blank" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 transition-colors text-center text-sm">
                            🎓 More Info
                        </a>
                    </div>
                </div>

                <!-- Related Algorithms -->
                <div>
                    <h3 class="font-semibold mb-3">Related Algorithms</h3>
                    <div id="relatedAlgorithms" class="space-y-2"></div>
                </div>
            </div>
        </aside>
    </div>

    <script src="js/themes.js"></script>
    <script src="js/framework.js"></script>
    <script src="js/algorithms-data.js"></script>
    <script src="js/algorithms/sorting.js"></script>
    <script src="js/algorithms/search.js"></script>
    <script src="js/algorithms/math.js"></script>
    <script src="js/algorithms/graph.js"></script>
    <script src="js/algorithms/classic.js"></script>
    <script src="js/viewer.js"></script>
</body>
</html>
